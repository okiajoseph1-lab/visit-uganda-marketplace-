<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Visit Uganda Marketplace</title>

  <meta name="description" content="Discover Uganda, connect with trusted local tourism providers, and plan your unforgettable Uganda experience.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #222;
      background: #f7f9f7;
    }

    header {
      background: #123d2a;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
      font-size: 15px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .hero {
      min-height: 560px;
      padding: 90px 6%;
      display: flex;
      align-items: center;
      background:
        linear-gradient(rgba(0,0,0,.5), rgba(0,0,0,.5)),
        url("https://images.unsplash.com/photo-1535338454770-8be927b5a00b?auto=format&fit=crop&w=1600&q=80");
      background-size: cover;
      background-position: center;
      color: white;
    }

    .hero-content {
      max-width: 700px;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 20px;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 14px 22px;
      border-radius: 7px;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-primary {
      background: #f4b400;
      color: #111;
    }

    .btn-secondary {
      background: white;
      color: #123d2a;
    }

    .section {
      padding: 65px 6%;
    }

    .section h2 {
      text-align: center;
      margin-bottom: 15px;
      font-size: 32px;
      color: #123d2a;
    }

    .section-intro {
      text-align: center;
      max-width: 700px;
      margin: 0 auto 40px;
      color: #555;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 22px;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
      text-align: center;
    }

    .card .icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .card h3 {
      color: #123d2a;
      margin-bottom: 10px;
    }

    .how-it-works {
      background: #eaf3ed;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
      max-width: 1000px;
      margin: auto;
    }

    .step {
      text-align: center;
      padding: 25px;
    }

    .number {
      width: 50px;
      height: 50px;
      line-height: 50px;
      margin: 0 auto 15px;
      background: #123d2a;
      color: white;
      border-radius: 50%;
      font-weight: bold;
      font-size: 20px;
    }

    .provider {
      background: #123d2a;
      color: white;
      text-align: center;
      padding: 70px 6%;
    }

    .provider h2 {
      color: white;
    }

    .provider p {
      max-width: 700px;
      margin: 0 auto 25px;
    }

    footer {
      background: #09251a;
      color: white;
      padding: 30px 6%;
      text-align: center;
    }

    footer p {
      margin: 6px 0;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      .hero h1 {
        font-size: 36px;
      }

      .hero p {
        font-size: 17px;
      }

      header {
        gap: 12px;
      }

      nav {
        width: 100%;
      }

      nav a {
        margin-left: 0;
        margin-right: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="logo">🇺🇬 Visit Uganda Marketplace</div>

    <nav>
      <a href="#home">Home</a>
      <a href="#services">Services</a>
      <a href="#how">How It Works</a>
      <a href="#providers">Providers</a>
    </nav>
  </header>


  <!-- HERO -->
  <section class="hero" id="home">
    <div class="hero-content">

      <h1>Discover Uganda. Experience More
